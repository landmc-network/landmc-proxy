# Dependency versions for landmc-proxy.
#
# Only what the proxy adds on top of the platform lives here. Everything the platform already
# manages - Okaeri, LiteCommands, Multification, Jedis, Adventure - arrives transitively with
# the platform modules, so its version is decided in one place: landmc-platform's own catalog.
[versions]

# Must match the version published by landmc-platform.
landmc-platform = "1.4.0"

# The menu wire format, published by landmc-menus.
landmc-menus = "1.7.0"

# Embedded database, shipped so the friends list works before anyone configures MariaDB.
h2 = "2.4.240"

# The driver production actually runs on; H2 is the out-of-the-box fallback.
mariadb = "3.5.10"

# Velocity 4 publishes Java 25 bytecode, which is why this project compiles with --release 25.
velocity = "4.1.1"

packetevents = "2.13.0"

# Optional at runtime: the proxy starts without it, only rank prefixes go missing.
luckperms = "5.5"

shadow = "9.6.1"

junit = "6.1.3"
slf4j = "2.0.17"

[libraries]
velocity-api = { module = "com.velocitypowered:velocity-api", version.ref = "velocity" }

menus-api = { module = "pl.landmc:menus-api", version.ref = "landmc-menus" }

platform-api = { module = "pl.landmc:platform-api", version.ref = "landmc-platform" }
platform-common = { module = "pl.landmc:platform-common", version.ref = "landmc-platform" }
platform-config = { module = "pl.landmc:platform-config", version.ref = "landmc-platform" }
platform-database = { module = "pl.landmc:platform-database", version.ref = "landmc-platform" }
h2 = { module = "com.h2database:h2", version.ref = "h2" }
mariadb = { module = "org.mariadb.jdbc:mariadb-java-client", version.ref = "mariadb" }
platform-messaging = { module = "pl.landmc:platform-messaging", version.ref = "landmc-platform" }
platform-proxy = { module = "pl.landmc:platform-proxy", version.ref = "landmc-platform" }

packetevents-velocity = { module = "com.github.retrooper:packetevents-velocity", version.ref = "packetevents" }
luckperms-api = { module = "net.luckperms:api", version.ref = "luckperms" }

junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-jupiter-params = { module = "org.junit.jupiter:junit-jupiter-params" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
slf4j-simple = { module = "org.slf4j:slf4j-simple", version.ref = "slf4j" }

[plugins]
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
